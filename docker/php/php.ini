; docker/php/php.ini — surcharges PHP pour le développement PersonaDLE

[PHP]
; Afficher les erreurs en dev (à ne PAS répliquer en prod)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Sessions — durée 30 jours (cohérent avec bootstrap.php)
session.gc_maxlifetime = 2592000
session.gc_probability = 1
session.gc_divisor     = 100

; Encodage par défaut
default_charset = "UTF-8"

[opcache]
opcache.enable = 1
opcache.revalidate_freq = 0   ; Revalider à chaque requête en dev (désactiver en prod)
opcache.validate_timestamps = 1
