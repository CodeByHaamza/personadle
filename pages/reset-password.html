<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — PersonaDLE</title>
    <link rel="stylesheet" href="../css/global.css?v=10" />
    <link rel="stylesheet" href="../css/langSelector.css" />
    <link rel="icon" type="image/gif" href="../img/persona_64x64.gif" />
    <script>
      if (localStorage.getItem("darkMode") === "enabled") {
        document.documentElement.classList.add("darkmode");
      }
    </script>
    <style>
      .rp-wrap {
        max-width: 420px;
        margin: 8vh auto;
        padding: 28px 24px;
        background: rgba(255, 255, 255, 0.96);
        border: 2px solid #e63946;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
      }
      .darkmode .rp-wrap { background: rgba(18, 13, 26, 0.96); color: #f0f0f0; }
      .rp-title { text-align: center; color: #e63946; margin: 0 0 6px; font-size: 1.5rem; }
      .rp-sub { text-align: center; opacity: 0.7; font-size: 0.9rem; margin: 0 0 20px; }
      .rp-field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 5px; }
      .rp-field label { font-size: 0.8rem; font-weight: 700; }
      .rp-field input {
        padding: 10px 12px; border: 2px solid rgba(230, 57, 70, 0.25);
        border-radius: 8px; font-size: 0.95rem; font-family: inherit;
        background: rgba(255, 255, 255, 0.9); color: inherit; outline: none;
      }
      .darkmode .rp-field input { background: rgba(28, 28, 28, 0.95); color: #f0f0f0; }
      .rp-field input:focus { border-color: #e63946; }
      .rp-btn {
        width: 100%; padding: 11px; margin-top: 6px; border: none; border-radius: 9px;
        background: #e63946; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer;
        transition: filter 0.15s;
      }
      .rp-btn:hover { filter: brightness(1.08); }
      .rp-btn:disabled { opacity: 0.6; cursor: default; }
      .rp-msg { text-align: center; font-size: 0.88rem; margin-top: 14px; min-height: 1.2em; }
      .rp-msg.ok { color: #2bae66; }
      .rp-msg.err { color: #e63946; }
      .rp-home { display: block; text-align: center; margin-top: 16px; color: #e63946; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="langSelectorMount"></div>

    <div class="rp-wrap">
      <h1 class="rp-title" data-i18n="reset_password.title">🔐 Reset your password</h1>
      <p class="rp-sub" data-i18n="reset_password.subtitle">
        Choose a new password for your PersonaDLE account.
      </p>

      <form id="rpForm">
        <div class="rp-field">
          <label for="rpPassword" data-i18n="reset_password.new_password_label">New password</label>
          <input type="password" id="rpPassword" autocomplete="new-password" required minlength="8"
                 placeholder="At least 8 characters" data-i18n-placeholder="reset_password.new_password_placeholder" />
        </div>
        <div class="rp-field">
          <label for="rpConfirm" data-i18n="reset_password.confirm_password_label">Confirm password</label>
          <input type="password" id="rpConfirm" autocomplete="new-password" required minlength="8" />
        </div>
        <button type="submit" class="rp-btn" id="rpBtn" data-i18n="reset_password.submit_btn">Update password</button>
      </form>

      <p id="rpMsg" class="rp-msg"></p>
      <a href="../index.html" class="rp-home" data-i18n="reset_password.back_link">← Back to PersonaDLE</a>
    </div>

    <script type="module">
      import { initLangSelector } from "../js/lang-selector.js";
      import { t } from "../js/i18n.js";

      await initLangSelector();

      const prefix = window.location.pathname.startsWith("/personadle/") ? "/personadle" : "";
      const token = new URLSearchParams(window.location.search).get("token") || "";
      const form = document.getElementById("rpForm");
      const msg = document.getElementById("rpMsg");
      const btn = document.getElementById("rpBtn");

      const setMsg = (text, ok) => {
        msg.textContent = text;
        msg.className = "rp-msg " + (ok ? "ok" : "err");
      };

      // Erreurs backend connues (toujours en anglais côté API) → mappées vers
      // leur traduction frontend. Fallback sur le texte brut si un jour l'API
      // renvoie un message qu'on n'a pas encore mappé.
      const BACKEND_ERROR_MAP = {
        "Invalid or expired reset link": () => t("reset_password.error_invalid_expired"),
        "Password must be at least 8 characters": () => t("reset_password.error_too_short"),
        "This password is too common — please choose a less predictable one": () =>
          t("reset_password.error_too_common"),
      };

      if (!token) {
        setMsg(t("reset_password.invalid_link"), false);
        form.style.display = "none";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const pwd = document.getElementById("rpPassword").value;
        const confirm = document.getElementById("rpConfirm").value;
        if (pwd.length < 8) return setMsg(t("reset_password.error_too_short"), false);
        if (pwd !== confirm) return setMsg(t("auth.error_passwords_mismatch"), false);

        btn.disabled = true;
        try {
          const res = await fetch(`${prefix}/api/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password: pwd }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            setMsg("✅ " + t("reset_password.success"), true);
            form.style.display = "none";
          } else {
            const mapped = BACKEND_ERROR_MAP[data.error]?.();
            setMsg(mapped || data.error || t("reset_password.error_invalid_expired"), false);
            btn.disabled = false;
          }
        } catch (_) {
          setMsg(t("reset_password.error_network"), false);
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
