<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard — PersonaDLE</title>
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Playfair+Display:ital,wght@1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../css/global.css?v=12" />
    <link rel="stylesheet" href="../../css/langSelector.css?v=4" />
    <link rel="stylesheet" href="../../css/bottomNav.css?v=1" />
    <link rel="stylesheet" href="../../css/calling-card.css?v=2" />
    <link rel="stylesheet" href="../../css/challenge-notif.css" />
    <link rel="stylesheet" href="../../css/challenge-result.css" />
    <link rel="stylesheet" href="../../css/p3-evoker-anim.css" />
    <link rel="stylesheet" href="../profile-page.css?v=2" />
    <link rel="stylesheet" href="./leaderboard.css?v=2" />

    <link rel="icon" type="image/gif" href="../../img/persona_64x64.gif" />

    <script>
      if (localStorage.getItem("darkMode") === "enabled") {
        document.documentElement.classList.add("darkmode");
      }
    </script>
  </head>
  <body>
    <!-- Header -->
    <header class="profile-page-header">
      <h1 class="profile-page-title">
        <span class="p5-diamond">◆</span>
        <span data-i18n="leaderboard.title">Leaderboard</span>
        <span class="p5-diamond">◆</span>
      </h1>
    </header>

    <div class="darkmode-toggle">
      <label class="switch">
        <input type="checkbox" id="darkModeToggle" />
        <span class="slider round"></span>
      </label>
      <span class="label-text" data-i18n="ui.dark_mode">Dark Mode</span>
    </div>

    <main class="leaderboard-page">
      <!-- Filtres -->
      <section class="lb-filters-card">
        <div class="lb-filters-header">
          <span class="lb-filters-diamond">◆</span>
          <span class="lb-filters-title" data-i18n="leaderboard.filters_title">Rankings</span>
          <span class="lb-filters-diamond">◆</span>
        </div>

        <!-- Scope (Global / Friends) -->
        <div class="lb-filter-group">
          <span class="lb-filter-label" data-i18n="leaderboard.filter_scope">Scope</span>
          <div class="lb-filter-pills" id="scopeFilter">
            <button class="lb-pill active" data-value="global" data-i18n="leaderboard.scope_global">
              Global
            </button>
            <button class="lb-pill" data-value="friends" data-i18n="leaderboard.scope_friends">
              Friends
            </button>
          </div>
        </div>

        <!-- Mode -->
        <div class="lb-filter-group">
          <span class="lb-filter-label" data-i18n="leaderboard.filter_mode">Mode</span>
          <div class="lb-filter-pills lb-filter-pills--modes" id="modeFilter">
            <button class="lb-pill active" data-value="all">
              <span class="lb-pill-icon">⭐</span><span class="lb-pill-text">All</span>
            </button>
            <button class="lb-pill" data-value="classic">
              <span class="lb-pill-icon">🔤</span><span class="lb-pill-text">Classic</span>
            </button>
            <button class="lb-pill" data-value="emoji">
              <span class="lb-pill-icon">😄</span><span class="lb-pill-text">Emoji</span>
            </button>
            <button class="lb-pill" data-value="silhouette">
              <span class="lb-pill-icon">👤</span><span class="lb-pill-text">Silhouette</span>
            </button>
            <button class="lb-pill" data-value="alloutattack">
              <span class="lb-pill-icon">⚔️</span><span class="lb-pill-text">All-Out</span>
            </button>
            <button class="lb-pill" data-value="personae">
              <span class="lb-pill-icon">✨</span><span class="lb-pill-text">Personae</span>
            </button>
            <button class="lb-pill" data-value="music">
              <span class="lb-pill-icon">🎵</span><span class="lb-pill-text">Music</span>
            </button>
          </div>
        </div>

        <!-- Période -->
        <div class="lb-filter-group">
          <span class="lb-filter-label" data-i18n="leaderboard.filter_period">Period</span>
          <div class="lb-filter-pills" id="periodFilter">
            <button class="lb-pill active" data-value="ever" data-i18n="leaderboard.period_ever">
              All time
            </button>
            <button class="lb-pill" data-value="month" data-i18n="leaderboard.period_month">
              Month
            </button>
            <button class="lb-pill" data-value="week" data-i18n="leaderboard.period_week">
              Week
            </button>
            <button class="lb-pill" data-value="day" data-i18n="leaderboard.period_day">
              Today
            </button>
          </div>
        </div>

        <!-- Métrique -->
        <div class="lb-filter-group">
          <span class="lb-filter-label" data-i18n="leaderboard.filter_metric">Metric</span>
          <div class="lb-filter-pills" id="metricFilter">
            <button class="lb-pill active" data-value="wins" data-i18n="leaderboard.metric_wins">
              Wins
            </button>
            <button class="lb-pill" data-value="winrate" data-i18n="leaderboard.metric_winrate">
              Win rate
            </button>
            <button class="lb-pill" data-value="streak" data-i18n="leaderboard.metric_streak">
              Best streak
            </button>
            <button class="lb-pill" data-value="perfect" data-i18n="leaderboard.metric_perfect">
              Perfect
            </button>
            <button class="lb-pill" data-value="games" data-i18n="leaderboard.metric_games">
              Games
            </button>
          </div>
        </div>
      </section>

      <!-- Filter note -->
      <div id="lbFilterNote" class="lb-filter-note"></div>

      <!-- Tableau du classement -->
      <section class="lb-table-card">
        <!-- Mon classement perso -->
        <div id="myRankBanner" class="lb-my-rank hidden"></div>

        <!-- Corps du classement -->
        <div id="leaderboardBody" class="lb-body">
          <p class="lb-loading" data-i18n="ui.loading">Loading…</p>
        </div>

        <!-- Pagination -->
        <div id="lbPagination" class="lb-pagination hidden">
          <button id="lbPrevBtn" class="btn-action" data-i18n="ui.prev">← Prev</button>
          <span id="lbPageInfo" class="lb-page-info"></span>
          <button id="lbNextBtn" class="btn-action" data-i18n="ui.next">Next →</button>
        </div>
      </section>
    </main>

    <!-- i18n -->
    <script type="module">
      import { initLang } from "../../js/i18n.js";
      window.__i18nReady = initLang();
    </script>

    <!-- API -->
    <script type="module" src="../../js/api.js"></script>

    <!-- Auth -->
    <script type="module">
      import { initAuth } from "../../js/auth.js";
      initAuth().catch(() => {});
    </script>

    <!-- Logique Leaderboard -->
    <script type="module" src="./leaderboard.js?v=1"></script>

    <!-- Notifications calling card -->
    <script type="module">
      import { initNotifications } from "../../js/notifications.js";
      if (window._authReady) await window._authReady;
      if (window._currentUser) initNotifications();
    </script>

    <!-- Dark mode + bottom nav -->
    <script type="module">
      import { initBottomNav } from "../../js/bottomNav.js";

      const toggle = document.getElementById("darkModeToggle");
      if (localStorage.getItem("darkMode") === "enabled") {
        document.body.classList.add("darkmode");
        toggle.checked = true;
      }
      toggle.addEventListener("change", () => {
        document.body.classList.toggle("darkmode", toggle.checked);
        localStorage.setItem("darkMode", toggle.checked ? "enabled" : "disabled");
      });

      initBottomNav();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("../../sw.js").catch(() => {});
        navigator.serviceWorker.addEventListener("message", (e) => {
          if (e.data?.type === "SW_UPDATED") window.location.reload();
        });
      }
    </script>
  </body>
</html>
