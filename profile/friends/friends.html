<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends — PersonaDLE</title>
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Playfair+Display:ital,wght@1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../css/global.css?v=11" />
    <link rel="stylesheet" href="../../css/langSelector.css?v=4" />
    <link rel="stylesheet" href="../../css/bottomNav.css?v=1" />
    <link rel="stylesheet" href="../../css/calling-card.css?v=2" />
    <link rel="stylesheet" href="../../css/challenge-result.css" />
    <link rel="stylesheet" href="../../css/p3-evoker-anim.css" />
    <link rel="stylesheet" href="../../css/social-link.css" />
    <link rel="stylesheet" href="../profile-page.css?v=1" />
    <link rel="stylesheet" href="./friends.css?v=3" />

    <link rel="icon" type="image/gif" href="../../img/persona_64x64.gif" />

    <script>
      if (localStorage.getItem("darkMode") === "enabled") {
        document.documentElement.classList.add("darkmode");
      }
    </script>
  </head>
  <body>
    <!-- Header -->
    <header class="profile-page-header">
      <h1 class="profile-page-title">
        <span class="p5-diamond">◆</span>
        <span data-i18n="friends.title">Friends</span>
        <span class="p5-diamond">◆</span>
      </h1>
    </header>

    <div class="darkmode-toggle">
      <label class="switch">
        <input type="checkbox" id="darkModeToggle" />
        <span class="slider round"></span>
      </label>
      <span class="label-text" data-i18n="ui.dark_mode">Dark Mode</span>
    </div>

    <!-- ── Non connecté ── -->
    <div id="friendsGuest" class="fr-page hidden">
      <div class="fr-guest-card">
        <div class="fr-guest-icon">👥</div>
        <h2 data-i18n="friends.title">Friends</h2>
        <p data-i18n="friends.login_required">Log in to add friends and see their profiles.</p>
        <a href="../profile.html" class="fr-btn fr-btn--primary">
          <span data-i18n="auth.login">Log in</span>
        </a>
      </div>
    </div>

    <!-- ── Connecté ── -->
    <main id="friendsConnected" class="fr-page hidden">
      <!-- Barre de recherche — search players OR add by friend code (8-char alphanumeric) -->
      <div class="fr-search-wrap">
        <div class="fr-search-box">
          <span class="fr-search-icon">🔍</span>
          <input
            type="text"
            id="browseSearch"
            class="fr-search-input"
            maxlength="60"
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="friends.search_placeholder"
            placeholder="Search by name or friend code…"
          />
          <button
            id="browseSearchAddBtn"
            class="fr-btn fr-btn--add fr-search-add-btn hidden"
            title="Send friend request"
          >
            <span data-i18n="friends.add_btn">Add</span>
          </button>
          <button
            id="browseSearchClear"
            class="fr-search-clear hidden"
            title="Clear"
            aria-label="Clear search"
          >
            ✕
          </button>
        </div>
        <p id="addByCodeMsg" class="fr-add-code-msg hidden"></p>
      </div>

      <!-- Demandes reçues -->
      <section id="pendingSection" class="fr-card hidden">
        <div class="fr-card-header">
          <h2 class="fr-card-title">
            <span class="fr-card-icon">⏳</span>
            <span data-i18n="friends.pending_title">Pending Requests</span>
          </h2>
          <span id="pendingCount" class="fr-badge">0</span>
        </div>
        <div id="pendingList" class="fr-list"></div>
      </section>

      <!-- Mes amis -->
      <section id="friendsSection" class="fr-card">
        <div class="fr-card-header">
          <h2 class="fr-card-title">
            <span class="fr-card-icon">💙</span>
            <span data-i18n="friends.list_title">My Friends</span>
          </h2>
          <span id="friendsCount" class="fr-count">0</span>
        </div>
        <div id="friendsList" class="fr-list">
          <p class="fr-empty" data-i18n="friends.no_friends">No friends yet.</p>
        </div>
      </section>

      <!-- Messagerie & Défis -->
      <section id="messagesSection" class="fr-card hidden">
        <div class="fr-card-header">
          <h2 class="fr-card-title">
            <span class="fr-card-icon">💬</span>
            <span data-i18n="friends.messages_title">Messages &amp; Challenges</span>
          </h2>
          <span id="unreadCount" class="fr-badge hidden">0</span>
          <button
            id="clearMsgsBtn"
            class="fr-msg-clear-btn"
            title="Clear resolved"
            data-i18n-title="friends.msg_clear"
            aria-label="Clear resolved messages"
          >
            🗑
          </button>
        </div>
        <div id="messagesList" class="fr-list fr-messages-list">
          <p class="fr-empty" data-i18n="ui.loading">Loading…</p>
        </div>
      </section>

      <!-- Tous les joueurs -->
      <section id="browseSection" class="fr-card">
        <div class="fr-card-header">
          <h2 class="fr-card-title">
            <span class="fr-card-icon">🌐</span>
            <span data-i18n="friends.browse_title">Browse Players</span>
          </h2>
          <span id="browseCount" class="fr-count">0</span>
        </div>
        <div id="browseList" class="fr-list">
          <p class="fr-empty fr-loading" data-i18n="ui.loading">Loading…</p>
        </div>
        <!-- Pagination browse -->
        <div id="browsePagination" class="fr-pagination hidden">
          <button id="browsePrevBtn" class="fr-page-btn">← Prev</button>
          <span id="browsePageInfo" class="fr-page-info"></span>
          <button id="browseNextBtn" class="fr-page-btn">Next →</button>
        </div>
      </section>
    </main>

    <!-- i18n -->
    <script type="module">
      import { initLang } from "../../js/i18n.js";
      window.__i18nReady = initLang();
    </script>

    <!-- API -->
    <script type="module" src="../../js/api.js"></script>

    <!-- Auth -->
    <script type="module">
      import { initAuth } from "../../js/auth.js";
      window._authReady = initAuth();
      window._authReady.catch(() => {});
    </script>

    <!-- Logique Friends -->
    <script type="module" src="./friends.js?v=4"></script>

    <!-- Notifications (calling card désactivée sur cette page) -->
    <script type="module">
      import { initNotifications } from "../../js/notifications.js";

      if (window._authReady) await window._authReady;
      if (window._currentUser) initNotifications();
    </script>

    <!-- Dark mode + bottom nav -->
    <script type="module">
      import { initBottomNav } from "../../js/bottomNav.js";

      const toggle = document.getElementById("darkModeToggle");
      if (localStorage.getItem("darkMode") === "enabled") {
        document.body.classList.add("darkmode");
        toggle.checked = true;
      }
      toggle.addEventListener("change", () => {
        document.body.classList.toggle("darkmode", toggle.checked);
        localStorage.setItem("darkMode", toggle.checked ? "enabled" : "disabled");
      });

      initBottomNav();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("../../sw.js").catch(() => {});
        navigator.serviceWorker.addEventListener("message", (e) => {
          if (e.data?.type === "SW_UPDATED") window.location.reload();
        });
      }
    </script>
  </body>
</html>
