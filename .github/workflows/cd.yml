name: CD — Deploy to Hostinger

# Déploiement AUTOMATIQUE à chaque push/merge sur `main` (après CI).
# Reste lançable MANUELLEMENT (avec option dry-run) via GitHub → Actions → Run workflow.
#
# ⚠️ Les migrations BDD ne sont PAS jouées par ce pipeline (risque sur du non-idempotent
#    sans tracker de migration). À appliquer manuellement en SSH quand le schéma change :
#      ssh hostinger-personadle
#      mysql -u <user> -p <db> < sql/migrations/0XX_xxx.sql
#
# Secrets requis (GitHub → Settings → Secrets → Actions) :
#   HOSTINGER_SSH_KEY   — clé privée SSH
#   HOSTINGER_HOST_KEY  — empreinte known_hosts du serveur
#   HOSTINGER_USER      — u870779941
#   HOSTINGER_HOST      — fr-int-web2056 (ou IP du serveur)
#   HOSTINGER_PATH      — ~/domains/personadle.net/public_html

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (simulation sans déploiement réel)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:

  # ── Étape 1 : CI complet avant tout déploiement ─────────────────────────────
  ci-checks:
    name: CI checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Check i18n key consistency
        run: npm run i18n:check

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        run: |
          errors=$(find api/ -name "*.php" -exec php -l {} \; | grep "Parse error" || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi

  # ── Étape 2 : Déploiement rsync vers Hostinger ──────────────────────────────
  deploy:
    name: Deploy via rsync
    runs-on: ubuntu-latest
    needs: ci-checks   # Ne tourne que si les CI checks passent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Injecter l'empreinte connue du serveur plutôt que d'ignorer la vérification
          echo "${{ secrets.HOSTINGER_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          RSYNC_OPTS="-avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='api/config.php' \
            --exclude='api/config.example.php' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='sql/' \
            --exclude='docker/' \
            --exclude='docs/' \
            --exclude='graphify-out/'"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            RSYNC_OPTS="$RSYNC_OPTS --dry-run"
            echo "DRY RUN — aucun fichier ne sera modifié sur le serveur"
          fi

          rsync $RSYNC_OPTS \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
