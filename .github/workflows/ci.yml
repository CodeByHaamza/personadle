name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── Job 1 : Tests JavaScript + vérification i18n ────────────────────────────
  test-js:
    name: JS Tests & i18n check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Validate character data
        run: npm run data:check

      # Valide le nommage/l'extension de tout asset en attente dans incoming/<type>/ avant
      # intégration (voir ROADMAP.md § "À venir — contenu conditionné à une sortie de jeu").
      # No-op si le dossier n'existe pas (état normal sur une branche propre).
      - name: Check pending asset ingestion (incoming/) convention
        run: npm run ingest:check

      - name: Run unit tests + coverage thresholds (Vitest)
        run: npm run test:coverage

      - name: Check i18n key consistency
        run: npm run i18n:check

      # Vérifie que CLAUDE.md/README.md/ROADMAP.md/etc. citent les vrais chiffres
      # (tests, tables SQL, clés i18n) — voir scripts/check-doc-numbers.js pour le contexte.
      - name: Check documentation numbers are up to date
        run: npm run docs:check

      # Vérifie que api/data/daily_pools.json (lu par api/lib/daily_target.php pour
      # l'anti-triche côté serveur) reflète bien les datasets JS sources — voir
      # scripts/export-daily-pools.js.
      - name: Check daily target pools are up to date
        run: npm run pools:check

      # Non bloquant tant que le repo n'est pas entièrement formaté (cf. AMELIORATIONS.md §8).
      - name: Check Prettier formatting (non-blocking)
        run: npm run format:check
        continue-on-error: true

  # ── Job 2 : Lint PHP + tests PHPUnit (logique + intégration BDD) ─────────────
  lint-php:
    name: PHP Lint & Tests
    runs-on: ubuntu-latest

    # Base MariaDB jetable pour les tests d'intégration (DatabaseIntegrationTest).
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: personadle_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Check PHP syntax (all .php files)
        run: |
          errors=$(find api/ -name "*.php" -exec php -l {} \; | grep "Parse error" || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "No PHP syntax errors found."

      - name: Load schema into MariaDB
        run: mysql -h 127.0.0.1 -P 3306 -u root -prootpassword personadle_db < sql/bdd_mysql.sql

      - name: Download PHPUnit
        run: wget -q -O phpunit.phar https://phar.phpunit.de/phpunit-11.phar

      - name: Run PHPUnit (logic + DB integration)
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: '3306'
          DB_TEST_NAME: personadle_db
          DB_TEST_USER: root
          DB_TEST_PASS: rootpassword
        run: php phpunit.phar

      - name: Static analysis (PHPStan)
        run: |
          wget -q -O phpstan.phar https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar
          php phpstan.phar analyse --no-progress

  # ── Job 3 : E2E Playwright contre la stack Docker complète ──────────────────
  # Auparavant lancés uniquement en local (voir tests-e2e/README.md). Branché en
  # CI le 8 juillet 2026, d'abord non-bloquant (continue-on-error) le temps de
  # confirmer sa stabilité. Critère de sortie atteint (28 runs consécutifs verts
  # sur develop, 8 juillet → 24 juillet 2026, vérifiés job par job — pas juste
  # au niveau du workflow) : bloquant depuis le 24 juillet 2026 (voir aussi la
  # note correspondante dans tests-e2e/README.md § Statut CI).
  e2e:
    name: E2E Playwright (Docker stack)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Docker stack (db + php + phpMyAdmin, seed inclus)
        run: docker compose up -d --build

      - name: Wait for the site to respond on :8080
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/auth/me -o /dev/null; then
              echo "Site up after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "Site never became ready — dumping logs"
          docker compose logs
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
